<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>סידור תפילת שלמה</title>
  <style>
    :root { --bg: #f4f1ea; --panel: #fffdf8; --ink: #222; --muted: #6b6457; --accent: #1f5f8b; --warn: #a15c00; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, "Segoe UI", Arial, sans-serif; }
    header { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid #ddd5c4; padding: 10px 16px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
    input { font-size: 18px; width: 6.5em; padding: 6px 8px; text-align: center; border: 1px solid #bbb; border-radius: 6px; }
    button { font-size: 16px; padding: 7px 14px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; cursor: pointer; }
    button.secondary { background: #fff; color: var(--accent); }
    button:disabled { opacity: .4; cursor: default; }
    #info { margin-top: 6px; text-align: center; font-size: 15px; color: var(--muted); min-height: 1.3em; }
    #info b { color: var(--ink); }
    #warn { text-align: center; font-size: 14px; color: var(--warn); min-height: 1.2em; }
    main { display: flex; justify-content: center; padding: 12px 16px 40px; }
    canvas { max-width: 100%; height: auto; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
  </style>
</head>
<body>
  <header>
    <form class="bar" id="jump">
      <label for="page">עמוד בסידור:</label>
      <input id="page" inputmode="text" autocomplete="off" placeholder="למשל 105">
      <button type="submit">עבור</button>
      <button type="button" class="secondary" id="prev">→ הקודם</button>
      <button type="button" class="secondary" id="next">הבא ←</button>
    </form>
    <div id="info">טוען…</div>
    <div id="warn"></div>
  </header>
  <main><canvas id="canvas"></canvas></main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
